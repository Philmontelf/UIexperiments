<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch — Disegno Libero</title>
<style>
  :root {
    --ink: #6366f1;
    --ink-glow: rgba(99, 102, 241, 0.45);
    --bg: #08080c;
    --panel: rgba(18, 18, 24, 0.72);
    --border: rgba(255, 255, 255, 0.08);
    --muted: #94a3b8;
    --text: #f1f5f9;
    --shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: none; }
  .cursor {
    position: fixed; pointer-events: none; z-index: 10000;
    width: 30px; height: 30px; transform: translate(-50%, -50%);
    border: 2px solid var(--ink); border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--ink), transparent 70%);
    box-shadow: 0 0 14px var(--ink-glow); mix-blend-mode: difference; display: none;
  }
  .cursor::after {
    content: ''; position: absolute; inset: 5px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.45);
  }
  .toolbar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; align-items: center; gap: 8px;
    padding: 10px 18px; max-width: 97vw; width: fit-content;
    background: var(--panel); backdrop-filter: blur(28px) saturate(1.2);
    border: 1px solid var(--border); border-radius: 999px;
    box-shadow: var(--shadow); flex-wrap: wrap; justify-content: center;
  }
  .group { display: flex; align-items: center; gap: 8px; }
  .sep { width: 1px; height: 22px; background: var(--border); margin: 0 5px; }
  .grouplabel {
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted); font-weight: 800; white-space: nowrap;
  }
  .tool-btn, .icon-btn {
    width: 38px; height: 38px; border-radius: 12px; border: none;
    color: #cbd5e1; background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06); cursor: pointer;
    font-size: 1.15rem; display: flex; align-items: center; justify-content: center;
    transition: all 0.18s; font-weight: 700;
  }
  .tool-btn:hover, .icon-btn:hover {
    background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-1px);
  }
  .tool-btn:active, .icon-btn:active { transform: translateY(0) scale(0.94); }
  .tool-btn.active {
    background: var(--ink); color: #fff; border-color: var(--ink);
    box-shadow: 0 0 18px var(--ink-glow);
  }
  .icon-btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .icon-btn.primary:hover { filter: brightness(1.15); }
  .colors { display: flex; gap: 6px; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    transition: all 0.16s;
  }
  .swatch:hover { transform: scale(1.14); border-color: rgba(255, 255, 255, 0.3); }
  .swatch.active {
    border-color: #fff; transform: scale(1.4);
    box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.18), 0 0 16px var(--ink-glow);
  }
  input[type=range] { width: 110px; accent-color: var(--ink); cursor: pointer; }
  .val { font-size: 0.68rem; color: var(--muted); min-width: 26px;
    text-align: right; font-variant-numeric: tabular-nums; }
  .stroke-preview {
    width: 34px; height: 5px; border-radius: 3px; background: var(--ink);
    opacity: 0.9; box-shadow: 0 0 10px var(--ink-glow);
  }
  .welcome {
    position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(8, 8, 12, 0.8); backdrop-filter: blur(16px);
    color: var(--text); padding: 28px; border-radius: 26px;
    width: 90vw; max-width: 440px; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(1); transition: all 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .welcome h1 {
    font-size: 1.7rem; letter-spacing: -0.5px; margin-bottom: 8px;
    background: linear-gradient(135deg, #ffffff, var(--ink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .welcome p { color: var(--muted); font-size: 0.9rem; line-height: 1.7; }
  .welcome.hidden {
    opacity: 0; pointer-events: none;
    transform: translate(-50%, -50%) scale(0.92);
  }
  [title]:hover::after {
    content: attr(title); position: absolute; bottom: -32px; left: 50%;
    transform: translateX(-50%); background: #0f172a; color: #fff;
    padding: 5px 9px; border-radius: 7px; font-size: 0.68rem; white-space: nowrap;
    z-index: 200; border: 1px solid var(--border); box-shadow: var(--shadow);
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="cursor" id="cursor"></div>
<div class="welcome" id="welcome">
  <h1>Sketch</h1>
  <p>Trascina con il mouse o il dito per disegnare.<br>Usa i controlli in alto.</p>
</div>
<div class="toolbar" id="toolbar">
  <div class="group">
    <span class="grouplabel">Strumento</span>
    <button class="tool-btn active" data-tool="pen" title="Matita (P)">✏</button>
    <button class="tool-btn" data-tool="eraser" title="Gomma (E)">🧽</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <span class="grouplabel">Colore</span>
    <div class="colors" id="colors"></div>
    <div class="stroke-preview" id="strokePreview"></div>
  </div>
  <div class="sep"></div>
  <div class="group">
    <span class="grouplabel">Spessore</span>
    <input type="range" id="thickness" min="1" max="60" value="6">
    <span class="val" id="thicknessVal">6</span>
  </div>
  <div class="sep"></div>
  <div class="group">
    <span class="grouplabel">Opacità</span>
    <input type="range" id="opacity" min="10" max="100" value="100">
    <span class="val" id="opacityVal">100%</span>
  </div>
  <div class="sep"></div>
  <div class="group actions">
    <button class="icon-btn" id="undo" title="Annulla (Ctrl+Z)">↩</button>
    <button class="icon-btn" id="redo" title="Ripristina (Ctrl+Y)">↪</button>
    <button class="icon-btn" id="clear" title="Cancella tela">🗑</button>
    <button class="icon-btn primary" id="download" title="Scarica PNG">⬇</button>
    <button class="icon-btn" id="fullscreen" title="Schermo intero">⛶</button>
  </div>
</div>
<script>
  <div class="group"><span class="grouplabel">Spessore</span><input type="range" id="thickness" min="1" max="60" value="6"><span class="val" id="thicknessVal">6</span></div><div class="sep"></div>
  <div class="group"><span class="grouplabel">Opacità</span><input type="range" id="opacity" min="10" max="100" value="100"><span class="val" id="opacityVal">100%</span></div><div class="sep"></div>
  <div class="group actions"><button class="icon-btn" id="undo" title="Annulla (Ctrl+Z)">↩</button><button class="icon-btn" id="redo" title="Ripristina (Ctrl+Y)">↪</button><button class="icon-btn" id="clear" title="Cancella tela">🗑</button><button class="icon-btn primary" id="download" title="Scarica PNG">⬇</button><button class="icon-btn" id="fullscreen" title="Schermo intero">⛶</button></div></div><script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),cursor=document.getElementById('cursor'),welcome=document.getElementById('welcome'),colorsEl=document.getElementById('colors'),thicknessInput=document.getElementById('thickness'),thicknessVal=document.getElementById('thicknessVal'),opacityInput=document.getElementById('opacity'),opacityVal=document.getElementById('opacityVal'),strokePreview=document.getElementById('strokePreview');const palette=['#f43f5e','#fb923c','#fbbf24','#84cc16','#22c55e','#10b981','#14b8a6','#06b6d4','#0ea5e9','#3b82f6','#6366f1','#a855f7','#d946ef','#f472b6','#ffffff','#94a3b8','#475569','#0f172a'];let color=palette[10],thickness=6,opacity=1,tool='pen',drawing=false,lastX=0,lastY=0,past=[],future=[],MAX_HISTORY=40;function resize(){const dpr=window.devicePixelRatio||1,rect=canvas.getBoundingClientRect(),w=Math.max(1,Math.round(rect.width*dpr)),h=Math.max(1,Math.round(rect.height*dpr)),prev=canvas.toDconst canvas=document.getElementById('canvas'),ctx=canvas.getx.lineCap='round';ctx.lineJoin='round';applyStyle();ctx.clearRect(0,0,w/dpr,h/dpr);const img=new Image();img.src=prev;img.onload=()=>ctx.drawImage(img,0,0,w/dpr,h/dpr);pushState()}window.addEventListener('resize',resize);resize();
function applyStyle(){ctx.strokeStyle=color;ctx.globalAlpha=opacity;ctx.lineWidth=thickness;ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';strokePreview.style.background=color;strokePreview.style.width=Math.max(4,thickness)+'px';strokePreview.style.height=Math.max(3,Math.round(thickness*0.5))+'px';cursor.style.borderColor=color;cursor.style.background='radial-gradient(circle at 30% 30%, '+color+', transparent 70%)';cursor.style.boxShadow='0 0 14px '+color}thicknessInput.addEventListener('input',()=>{thickness=parseInt(thicknessInput.value,10);thicknessVal.textContent=thickness;applyStyle()});opacityInput.addEventListener('input',()=>{opacity=parseInt(opacityInput.value,10)/100;opacityVal.textContent=Math.round(opacity*100)+'%';applyStyle()});function pushState(){const data=canvas.toDataURL();if(past.length>=MAX_HISTORY)past.shift();past.push(data);future=[]}function restore(url){const img=new Image();img.src=url;img.onfunction applyStyle(){ctx.strokeStyle=color;ctx.globalAlpha=drawImage(img,0,0)}}function undo(){if(past.length<=1)return;future.push(past.pop());restore(past[past.length-1])}function redo(){if(future.length===0)return;past.push(future.pop());restore(past[past.length-1])}function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);pushState()}
palette.forEach((c,i)=>{const sw=document.createElement('div');sw.className='swatch'+(i===10?' active':'');sw.style.background=c;sw.setAttribute('aria-label','Colore '+(i+1));sw.addEventListener('click',()=>{color=c;document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));sw.classList.add('active');applyStyle()});colorsEl.appendChild(sw)});document.querySelectorAll('.tool-btn').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');tool=btn.dataset.tool;applyStyle()})});function begin(x,y){welcome.classList.add('hidden');drawing=true;lastX=x;lastY=y;ctx.beginPath();ctx.moveTo(x,y)}function draw(x,y){if(!drawing)return;ctx.lineTo(x,y);ctx.stroke();lastX=x;lastY=y}function end(){if(!drawing)return;drawing=false;pushState()}canvas.addEventListener('mousedown',e=>begin(e.clientX,e.clientY));canvas.addEventListener('mousemove',e=>{cupaletstyle.left=e.clientX+'px';cursor.style.top=e.clientY+'px';cursor.style.display='block';draw(e.clientX,e.clientY)});window.addEventListener('mouseup',end);window.addEventListener('mouseleave',end);canvas.addEventListener('touchstart',e=>{e.preventDefault();begin(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});canvas.addEventListener('touchmove',e=>{e.preventDefault();cursor.style.left=e.touches[0].clientX+'px';cursor.style.top=e.touches[0].clientY+'px';cursor.style.display='block';draw(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});window.addEventListener('touchend',end);window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&e.key==='y'){e.preventDefault();redo}if(e.key==='p'||e.key==='P')document.querySelector('[data-tool="pen"]').click()if(e.key==='e'||e.key==='E')document.querySelector('[data-tool="eraser"]').click()if(e.key==='c'||e.key==='C')clearCanvas()});document.getElementById('undo').addEventListener('click',undo);document.getElementById('redo').addEventListener('click',redo);document.getElementById('clear').addEventListener('click',clearCanvas);document.getElementById('download').addEventListener('click',()=>{const a=document.createElement('a');a.download='sketch-'+Date.now()+'.png';a.href=canvas.toDataURL();a.click()});document.getElementById('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()});applyStyle();pushState();</script></body></html>
