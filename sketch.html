<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch — Disegno Libero</title>
<style>
  :root{--ink:#6366f1;--glow:rgba(99,102,241,.45);--bg:#08080c;--panel:rgba(18,18,24,.72);--border:rgba(255,255,255,.08);--muted:#94a3b8;--text:#f1f5f9;--shadow:0 24px 60px rgba(0,0,0,.6)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
  body{color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:none}
  .cursor{position:fixed;pointer-events:none;z-index:10000;width:30px;height:30px;transform:translate(-50%,-50%);border:2px solid var(--ink);border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--ink),transparent 70%);box-shadow:0 0 14px var(--glow);mix-blend-mode:difference;display:none}
  .cursor::after{content:'';position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(255,255,255,.45)}
  .toolbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:8px;padding:10px 18px;max-width:97vw;width:fit-content;background:var(--panel);backdrop-filter:blur(28px)saturate(1.2);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow);flex-wrap:wrap;justify-content:center}
  .group{display:flex;align-items:center;gap:8px}
  .sep{width:1px;height:22px;background:var(--border);margin:0 5px}
  .grouplabel{font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800;white-space:nowrap}
  .tool-btn,.icon-btn{width:38px;height:38px;border-radius:12px;border:none;color:#cbd5e1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);cursor:pointer;font-size:1.15rem;display:flex;align-items:center;justify-content:center;transition:all .18s;font-weight:700}
  .tool-btn:hover,.icon-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
  .tool-btn:active,.icon-btn:active{transform:translateY(0)scale(.94)}
  .tool-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 0 18px var(--glow)}
  .icon-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .icon-btn.primary:hover{filter:brightness(1.15)}
  .colors{display:flex;gap:6px}
  .swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:all .16s}
  .swatch:hover{transform:scale(1.14);border-color:rgba(255,255,255,.3)}
  .swatch.active{border-color:#fff;transform:scale(1.4);box-shadow:0 0 0 5px rgba(255,255,255,.18),0 0 16px var(--glow)}
  input[type=range]{width:110px;accent-color:var(--ink);cursor:pointer}
  .val{font-size:.68rem;color:var(--muted);min-width:26px;text-align:right}
  .stroke-preview{width:34px;height:5px;border-radius:3px;background:var(--ink);opacity:.9;box-shadow:0 0 10px var(--glow)}
  .welcome{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(8,8,12,.8);backdrop-filter:blur(16px);color:var(--text);padding:28px;border-radius:26px;width:90vw;max-width:440px;left:50%;top:50%;transform:translate(-50%,-50%)scale(1);transition:all .45s cubic-bezier(.2,.8,.2,1);border:1px solid var(--border);box-shadow:var(--shadow)}
  .welcome h1{font-size:1.7rem;letter-spacing:-.5px;margin-bottom:8px;background:linear-gradient(135deg,#fff,var(--ink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .welcome p{color:var(--muted);font-size:.9rem;line-height:1.7}
  .welcome.hidden{opacity:0;pointer-events:none;transform:translate(-50%,-50%)scale(.92)}
  [title]:hover::after{content:attr(title);position:absolute;bottom:-32px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:5px 9px;border-radius:7px;font-size:.68rem;white-space:nowrap;z-index:200;border:1px solid var(--border);box-shadow:var(--shadow)}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="cursor" id="cursor"></div>
<div class="welcome" id="welcome"><h1>Sketch</h1><p>Trascina con il mouse o il dito per disegnare.<br>Usa i controlli in alto.</p></div>
<div class="toolbar" id="toolbar">
  <div class="group"><span class="grouplabel">Strumento</span><button class="tool-btn active" data-tool="pen" title="Matita (P)">✏</button><button class="tool-btn" data-tool="eraser" title="Gomma (E)">🧽</button></div><div class="sep"></div>
  <div class="group"><span class="grouplabel">Colore</span><div class="colors" id="colors"></div><div class="stroke-preview" id="strokePreview"></div></div><div class="sep"></div>
  <div class="group"><span class="grouplabel">Spessore</span><input type="range" id="thickness" min="1" max="60" value="6"><span class="val" id="thicknessVal">6</span></div><div class="sep"></div>
  <div class="group"><span class="grouplabel">Opacità</span><input type="range" id="opacity" min="10" max="100" value="100"><span class="val" id="opacityVal">100%</span></div><div class="sep"></div>
  <div class="group actions"><button class="icon-btn" id="undo" title="Annulla (Ctrl+Z)">↩</button><button class="icon-btn" id="redo" title="Ripristina (Ctrl+Y)">↪</button><button class="icon-btn" id="clear" title="Cancella tela">🗑</button><button class="icon-btn primary" id="download" title="Scarica PNG">⬇</button><button class="icon-btn" id="fullscreen" title="Schermo intero">⛶</button></div>
</div>
<script>
const c=document.getElementById('canvas'),x=c.getContext('2d'),cur=document.getElementById('cursor'),wel=document.getElementById('welcome'),col=document.getElementById('colors'),ti=document.getElementById('thickness'),tv=document.getElementById('thicknessVal'),oi=document.getElementById('opacity'),ov=document.getElementById('opacityVal'),sp=document.getElementById('strokePreview');
const pal=['#f43f5e','#fb923c','#fbbf24','#84cc16','#22c55e','#10b981','#14b8a6','#06b6d4','#0ea5e9','#3b82f6','#6366f1','#a855f7','#d946ef','#f472b6','#fff','#94a3b8','#475569','#0f172a'];
let color=pal[10],th=6,op=1,tool='pen',draw=0,lx=0,ly=0,past=[],fut=[],MH=40;
function rz(){const w=c.clientWidth,h=c.clientHeight,prev=c.toDataURL();c.width=w;c.height=h;x.lineCap='round';x.lineJoin='round';a();x.clearRect(0,0,w,h);const i=new Image();i.src=prev;i.onload=()=>x.drawImage(i,0,0);p()}
window.onresize=rz;rz();
function a(){x.strokeStyle=color;x.globalAlpha=op;x.lineWidth=th;x.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';sp.style.background=color;sp.style.width=Math.max(4,th)+'px';sp.style.height=Math.max(3,Math.round(th*.5))+'px';cur.style.borderColor=color;cur.style.background='radial-gradient(circle at 30% 30%,'+color+',transparent 70%)';cur.style.boxShadow='0 0 14px '+color}
ti.oninput=()=>{th=parseInt(ti.value,10);tv.textContent=th;a()}
oi.oninput=()=>{op=parseInt(oi.value,10)/100;ov.textContent=Math.round(op*100)+'%';a()}
function p(){const d=c.toDataURL();if(past.length>=MH)past.shift();past.push(d);fut=[]}
function u(){if(past.length<=1)return;fut.push(past.pop());R(past[past.length-1])}
function rd(){if(fut.length===0)return;past.push(fut.pop());R(past[past.length-1])}
function cl(){x.clearRect(0,0,c.width,c.height);p()}
function R(u){const i=new Image();i.src=u;i.onload=()=>{x.clearRect(0,0,c.width,c.height);x.drawImage(i,0,0)}}
pal.forEach((c,i)=>{const s=document.createElement('div');s.className='swatch'+(i===10?' active':'');s.style.background=c;s.onclick=()=>{color=c;document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));s.classList.add('active');a()};col.appendChild(s)});
document.querySelectorAll('.tool-btn').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));b.classList.add('active');tool=b.dataset.tool;a()}});
function b(X,Y){wel.classList.add('hidden');draw=1;lx=X;ly=Y;x.beginPath();x.moveTo(X,Y)}
function d(X,Y){if(!draw)return;x.lineTo(X,Y);x.stroke();lx=X;ly=Y}
function e(){if(!draw)return;draw=0;p()}
c.onmousedown=e=>b(e.clientX,e.clientY);
c.onmousemove=e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';cur.style.display='block';d(e.clientX,e.clientY)};
window.onmouseup=e;window.onmouseleave=e;
c.ontouchstart=e=>{e.preventDefault();b(e.touches[0].clientX,e.touches[0].clientY)};
c.ontouchmove=e=>{e.preventDefault();cur.style.left=e.touches[0].clientX+'px';cur.style.top=e.touches[0].clientY+'px';cur.style.display='block';d(e.touches[0].clientX,e.touches[0].clientY)};
window.ontouchend=e;
window.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();u()}if((e.ctrlKey||e.metaKey)&&e.key==='y'){e.preventDefault();rd()}if(e.key==='p'||e.key==='P')document.querySelector('[data-tool="pen"]').click()if(e.key==='e'||e.key==='E')document.querySelector('[data-tool="eraser"]').click()if(e.key==='c'||e.key==='C')cl()};
document.getElementById('undo').onclick=u;document.getElementById('redo').onclick=rd;document.getElementById('clear').onclick=cl;
document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.download='sketch-'+Date.now()+'.png';a.href=c.toDataURL();a.click()};
document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()};
a();p();</script></body></html>
