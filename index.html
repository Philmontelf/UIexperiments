<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Experiments – Interruttore a Levetta</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #f5f7fa;
            --text-color: #333;
            --plate-color: #e2e2e2;
            --plate-shadow: #b8b8b8;
            --lever-off: #ef5350;
            --lever-on: #4caf50;
            --lever-shadow: #9e9e9e;
            --label-color: #555;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --plate-color: #3a3a3a;
            --plate-shadow: #222;
            --lever-off: #666;
            --lever-on: #66bb6a;
            --lever-shadow: #000;
            --label-color: #aaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .wall-switch {
            position: relative;
            width: 120px;
            height: 200px;
            background: var(--plate-color);
            border: 2px solid var(--plate-shadow);
            border-radius: 12px;
            box-shadow:
                0 8px 0 var(--plate-shadow),
                0 12px 16px rgba(0,0,0,0.15);
            transition: box-shadow 0.2s, border-color 0.3s;
            user-select: none;
        }

        .wall-switch:active {
            box-shadow:
                0 4px 0 var(--plate-shadow),
                0 6px 10px rgba(0,0,0,0.15);
            transform: translateY(4px);
        }

        .label-on,
        .label-off {
            position: absolute;
            top: 18px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--label-color);
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        .label-off { left: 34px; }
        .label-on  { right: 34px; }

        .lever {
            position: absolute;
            top: 55px;
            left: 50%;
            width: 44px;
            height: 110px;
            background: var(--lever-off);
            border: 2px solid var(--lever-shadow);
            border-radius: 6px;
            transform: translateX(-50%) rotate(-20deg);
            transform-origin: 50% 165px;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        background 0.3s,
                        border-color 0.3s;
            box-shadow: 0 4px 0 var(--lever-shadow);
            cursor: pointer;
        }

        .lever:active {
            transform: translateX(-50%) rotate(-20deg) scale(0.96);
            box-shadow: 0 2px 0 var(--lever-shadow);
        }

        input[type="checkbox"] {
            display: none;
        }
        .wall-switch:has(input:checked) .lever {
            transform: translateX(-50%) rotate(20deg);
            background: var(--lever-on);
            border-color: #2e7d32;
            box-shadow: 0 4px 0 #1b5e20;
        }

        .wall-switch:has(input:checked) .label-on {
            color: var(--lever-on);
        }

        .wall-switch:has(input:checked) .label-off {
            color: var(--label-color);
        }

        .wall-switch:has(input:not(:checked)) .label-off {
            color: var(--lever-off);
        }

        .wall-switch:has(input:not(:checked)) .label-on {
            color: var(--label-color);
        }

        .theme-btn {
            background: var(--plate-color);
            color: var(--text-color);
            border: 2px solid var(--plate-shadow);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .theme-btn:hover {
            filter: brightness(1.1);
        }

        .theme-btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.3);
        }
    </style>
</head>
<body>
    <h1>UI Experiments</h1>

    <div class="panel">
        <div class="wall-switch">
            <input type="checkbox" id="switch" aria-label="Interruttore luce">
            <span class="label-off">OFF</span>
            <span class="label-on">ON</span>
            <label class="lever" for="switch" aria-hidden="true"></label>
        </div>

        <button class="theme-btn" id="theme-toggle" aria-label="Cambia tema">
            <span id="theme-text">Tema scuro</span>
        </button>
    </div>

    <script>
        const themeBtn = document.getElementById('theme-toggle');
        const themeText = document.getElementById('theme-text');
        const html = document.documentElement;

        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const currentTheme = savedTheme || (prefersDark ? 'dark' : 'light');

        function setTheme(theme) {
            if (theme === 'dark') {
                html.setAttribute('data-theme', 'dark');
                themeText.textContent = 'Tema chiaro';
                localStorage.setItem('theme', 'dark');
            } else {
                html.removeAttribute('data-theme');
                themeText.textContent = 'Tema scuro';
                localStorage.setItem('theme', 'light');
            }
        }

        setTheme(currentTheme);

        themeBtn.addEventListener('click', () => {
            const isDark = html.getAttribute('data-theme') === 'dark';
            setTheme(isDark ? 'light' : 'dark');
        });
    </script>
</body>
</html>
